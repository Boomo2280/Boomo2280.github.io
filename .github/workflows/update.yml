name: Обновление данных портала

on:
  schedule:
    - cron: "0 */3 * * *"      # каждые 3 часа (время UTC)
  workflow_dispatch:           # кнопка «Run workflow» вручную

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update.py          # если JSON лежат в data/, замените на: python update.py --out data
      - name: Коммит, если данные изменились
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Автообновление данных" && git push)
