							$(function () {

									format: 'dd.mm.yyyy',
									language: 'ru-RU'
								});
								$('#period-ssylka').click(function() {
									$('#period-dialog').toggle();
								});
								$('#novosti-god').html(skripty.novosti('2627'));
							});
